name: Database

# Tests migrations on a throwaway Postgres, then applies them to Supabase.
# Requires repository secrets: SUPABASE_ACCESS_TOKEN, SUPABASE_DB_PASSWORD, SUPABASE_PROJECT_REF.

on:
  push:
    branches: [main]
    paths:
      - "supabase/**"
      - "scripts/test-db.sh"
      - ".github/workflows/db-migrate.yml"
  pull_request:
    paths:
      - "supabase/**"
      - "scripts/test-db.sh"
  workflow_dispatch:

concurrency:
  group: db-migrate
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - name: Run database security tests
        run: scripts/test-db.sh

  migrate:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.122.0
      # Each step re-emits the CLI's last output lines as an error annotation,
      # so failures are readable from the run summary without opening the log.
      - name: Link project
        run: |
          if ! supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD" > out.txt 2>&1; then
            cat out.txt
            echo "::error title=supabase link failed::$(tail -n 5 out.txt | tr '\n' ' ')"
            exit 1
          fi
          cat out.txt
      - name: Apply migrations
        run: |
          if ! supabase db push --password "$SUPABASE_DB_PASSWORD" > out.txt 2>&1; then
            cat out.txt
            echo "::error title=supabase db push failed::$(tail -n 5 out.txt | tr '\n' ' ')"
            exit 1
          fi
          cat out.txt
