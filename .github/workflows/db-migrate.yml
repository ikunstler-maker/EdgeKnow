name: Database

# Tests migrations on a throwaway Postgres and workspace isolation on a local
# Supabase, then backs up the production database and applies the migrations.
# Requires repository secrets: SUPABASE_ACCESS_TOKEN, SUPABASE_DB_PASSWORD, SUPABASE_PROJECT_REF.

on:
  push:
    branches: [main]
    paths:
      - "supabase/**"
      - "scripts/**"
      - "src/**"
      - "package*.json"
      - ".github/workflows/db-migrate.yml"
  pull_request:
    paths:
      - "supabase/**"
      - "scripts/**"
      - "src/**"
      - "package*.json"
      - ".github/workflows/db-migrate.yml"
  workflow_dispatch:

concurrency:
  group: db-migrate
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v6
      - name: Run database security tests
        run: scripts/test-db.sh
      - name: Run team database security tests (path C)
        run: scripts/test-team-db.sh

  # Real HTTP requests (Auth + PostgREST + RLS) prove two workspaces can't see each other.
  api:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: supabase/setup-cli@v3
        with:
          version: 2.122.0
      - name: Start local Supabase
        # Test users sign in with a password; only this throwaway copy allows it.
        run: |
          sed -i '/^\[auth.email\]/,/^\[/ s/^enable_signup = false/enable_signup = true/' supabase/config.toml
          supabase start -x studio,imgproxy,mailpit,edge-runtime,logflare,vector,supavisor,realtime,postgres-meta
      - name: Run API isolation test
        run: |
          supabase status -o json > status.json
          node scripts/api-isolation.mjs status.json
      # Then click through the workspace screens in a real browser against the same backend.
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # Path C: the "Team Delta" workspace keeps its data in a second, team-owned stack
      # that trusts the app's own (throwaway) EdgeKnow signing key.
      - name: Team database for the Team Delta workspace
        run: |
          keys="$(node -e "const {generateKeyPairSync,randomUUID}=require('node:crypto');const k=generateKeyPairSync('ec',{namedCurve:'P-256'}).privateKey.export({format:'jwk'});console.log(JSON.stringify([{...k,kid:randomUUID()}]))")"
          echo "EDGEKNOW_OIDC_SIGNING_KEYS=$keys" >> "$GITHUB_ENV"
          drive_key="ci-drive-token-key-$(openssl rand -hex 16)"
          echo "DRIVE_TOKEN_KEY=$drive_key" >> "$GITHUB_ENV"
          TEAM_STACKS=team-b TEAM_SIGNING_KEYS="$keys" scripts/team-stacks.sh
          DRIVE_TOKEN_KEY="$drive_key" node --experimental-strip-types scripts/register-team.mjs status.json .team-stacks/team-b/status.json
      - name: Build and start the app against local Supabase
        run: |
          export NEXT_PUBLIC_SUPABASE_URL="$(jq -r .API_URL status.json)"
          export NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY="$(jq -r '.PUBLISHABLE_KEY // .ANON_KEY' status.json)"
          # Throwaway values for this run only; Google Drive is replaced by a local stand-in.
          export SUPABASE_SECRET_KEY="$(jq -r '.SECRET_KEY // .SERVICE_ROLE_KEY' status.json)"
          export DRIVE_FAKE_DIR="$RUNNER_TEMP/fake-drive"
          export CRON_SECRET="ci-cron-secret"
          echo "DRIVE_FAKE_DIR=$DRIVE_FAKE_DIR" >> "$GITHUB_ENV"
          echo "CRON_SECRET=$CRON_SECRET" >> "$GITHUB_ENV"
          npm run build
          nohup npm start -- -p 3000 > next.log 2>&1 &
          for i in $(seq 1 30); do curl -sf -o /dev/null http://localhost:3000/privacy && break; sleep 1; done
      - name: Run browser smoke test
        run: |
          if ! node scripts/e2e-smoke.mjs status.json http://localhost:3000; then
            echo "::error title=next.log::$(grep -iE 'error|failed' next.log | tail -n 8 | tr '\n' ' ' | cut -c1-900)"
            echo "::error title=next.log (end)::$(tail -n 25 next.log | tr '\n' ' ' | cut -c1-1500)"
            exit 1
          fi

  # Path C: two local Supabase stacks stand in for two teams' own projects.
  team:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: supabase/setup-cli@v3
        with:
          version: 2.122.0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Start two team stacks
        run: scripts/team-stacks.sh
      - name: Run team isolation test
        run: node --experimental-strip-types scripts/team-isolation.mjs .team-stacks

  migrate:
    needs: [test, api, team]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v6
      - uses: supabase/setup-cli@v3
        with:
          version: 2.122.0
      # Each step re-emits the CLI's last output lines as an error annotation,
      # so failures are readable from the run summary without opening the log.
      - name: Link project
        run: |
          if ! supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD" > out.txt 2>&1; then
            cat out.txt
            echo "::error title=supabase link failed::$(tail -n 5 out.txt | tr '\n' ' ')"
            exit 1
          fi
          cat out.txt
      # Safety copy of production data, kept 7 days with this run (private to the repository).
      - name: Back up database
        run: |
          if ! supabase db dump --linked --data-only -f backup.sql --password "$SUPABASE_DB_PASSWORD" > out.txt 2>&1; then
            cat out.txt
            echo "::error title=backup failed::$(tail -n 5 out.txt | tr '\n' ' ')"
            exit 1
          fi
      - uses: actions/upload-artifact@v6
        with:
          name: db-backup-${{ github.run_id }}
          path: backup.sql
          retention-days: 7
      - name: Apply migrations
        run: |
          if ! supabase db push --password "$SUPABASE_DB_PASSWORD" > out.txt 2>&1; then
            cat out.txt
            echo "::error title=supabase db push failed::$(tail -n 5 out.txt | tr '\n' ' ')"
            exit 1
          fi
          cat out.txt
