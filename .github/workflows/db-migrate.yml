name: Database

# Tests migrations on a throwaway Postgres and workspace isolation on a local
# Supabase, then backs up the production database and applies the migrations.
# Requires repository secrets: SUPABASE_ACCESS_TOKEN, SUPABASE_DB_PASSWORD, SUPABASE_PROJECT_REF.

on:
  push:
    branches: [main]
    paths:
      - "supabase/**"
      - "scripts/**"
      - ".github/workflows/db-migrate.yml"
  pull_request:
    paths:
      - "supabase/**"
      - "scripts/**"
      - ".github/workflows/db-migrate.yml"
  workflow_dispatch:

concurrency:
  group: db-migrate
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v6
      - name: Run database security tests
        run: scripts/test-db.sh

  # Real HTTP requests (Auth + PostgREST + RLS) prove two workspaces can't see each other.
  api:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: supabase/setup-cli@v3
        with:
          version: 2.122.0
      - name: Start local Supabase
        # Test users sign in with a password; only this throwaway copy allows it.
        run: |
          sed -i '/^\[auth.email\]/,/^\[/ s/^enable_signup = false/enable_signup = true/' supabase/config.toml
          supabase start -x studio,imgproxy,mailpit,edge-runtime,logflare,vector,supavisor,realtime,storage-api,postgres-meta
      - name: Run API isolation test
        run: |
          supabase status -o json > status.json
          node scripts/api-isolation.mjs status.json

  migrate:
    needs: [test, api]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v6
      - uses: supabase/setup-cli@v3
        with:
          version: 2.122.0
      # Each step re-emits the CLI's last output lines as an error annotation,
      # so failures are readable from the run summary without opening the log.
      - name: Link project
        run: |
          if ! supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD" > out.txt 2>&1; then
            cat out.txt
            echo "::error title=supabase link failed::$(tail -n 5 out.txt | tr '\n' ' ')"
            exit 1
          fi
          cat out.txt
      # Safety copy of production data, kept 7 days with this run (private to the repository).
      - name: Back up database
        run: |
          if ! supabase db dump --linked --data-only -f backup.sql --password "$SUPABASE_DB_PASSWORD" > out.txt 2>&1; then
            cat out.txt
            echo "::error title=backup failed::$(tail -n 5 out.txt | tr '\n' ' ')"
            exit 1
          fi
      - uses: actions/upload-artifact@v6
        with:
          name: db-backup-${{ github.run_id }}
          path: backup.sql
          retention-days: 7
      - name: Apply migrations
        run: |
          if ! supabase db push --password "$SUPABASE_DB_PASSWORD" > out.txt 2>&1; then
            cat out.txt
            echo "::error title=supabase db push failed::$(tail -n 5 out.txt | tr '\n' ' ')"
            exit 1
          fi
          cat out.txt
