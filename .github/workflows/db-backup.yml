name: Daily database backup

# A full copy of the production database (schema and data) every night, kept
# 30 days as a private artifact of this repository (Actions → this workflow →
# a run → Artifacts). Free: about a minute of Actions time a day.
# Uses the same repository secrets as the Database workflow.

on:
  schedule:
    - cron: "17 1 * * *"
  workflow_dispatch:

concurrency:
  group: db-migrate
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-24.04
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v6
      - uses: supabase/setup-cli@v3
        with:
          version: 2.122.0
      - name: Dump schema and data
        run: |
          if ! supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD" > out.txt 2>&1; then
            echo "::error title=supabase link failed::$(tail -n 5 out.txt | tr '\n' ' ')"
            exit 1
          fi
          stamp=$(date -u +%Y-%m-%d)
          mkdir backup
          if ! supabase db dump --linked -f "backup/schema-$stamp.sql" --password "$SUPABASE_DB_PASSWORD" > out.txt 2>&1 \
            || ! supabase db dump --linked --data-only -f "backup/data-$stamp.sql" --password "$SUPABASE_DB_PASSWORD" > out.txt 2>&1; then
            echo "::error title=backup failed::$(tail -n 5 out.txt | tr '\n' ' ')"
            exit 1
          fi
          echo "::notice title=Backup::$(du -sh backup | cut -f1) saved for 30 days"
      - uses: actions/upload-artifact@v6
        with:
          name: db-daily-${{ github.run_id }}
          path: backup/
          retention-days: 30
